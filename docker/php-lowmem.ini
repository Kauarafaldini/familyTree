; ============================================================================
; PHP em modo "pouca memória" para o plano gratuito do Render
; ============================================================================
memory_limit = 96M
post_max_size = 24M
upload_max_filesize = 24M
max_execution_time = 30
output_buffering = 4096
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache: compila os .php uma vez e reaproveita (menos CPU e menos RAM por requisição)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 16
opcache.interned_strings_buffer = 4
opcache.max_accelerated_files = 500
opcache.validate_timestamps = 0
opcache.jit = off
