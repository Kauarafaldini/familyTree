# ============================================================================
# Apache em modo "pouca memória" para o plano gratuito do Render (512 MB)
# Cada processo do Apache carrega o PHP + ext-mongodb (~20-30 MB cada).
# O padrão permite até 150 processos -> estoura a RAM facilmente.
# ============================================================================
<IfModule mpm_prefork_module>
    StartServers             1
    MinSpareServers          1
    MaxSpareServers          2
    MaxRequestWorkers        4
    ServerLimit              4
    # Recicla processos periodicamente para devolver memória ao sistema
    MaxConnectionsPerChild   300
</IfModule>

# Conexões curtas liberam os processos mais rápido
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 50
Timeout 60

# Compressão gzip do JSON (respostas até ~10x menores)
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript text/javascript
</IfModule>

# Cache no navegador para arquivos estáticos (menos requisições ao servidor)
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType text/css "access plus 1 hour"
    ExpiresByType application/javascript "access plus 1 hour"
    ExpiresByType text/javascript "access plus 1 hour"
</IfModule>

ServerTokens Prod
ServerSignature Off
